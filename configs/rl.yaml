# Reinforcement-learning setup: data splits, the allocator environment, and the
# bar the data must clear before training (ddb.rl.readiness).

splits:
  # Time periods never overlap. `embargo_days` are dropped at the start of
  # validation and test, so nothing learned from a window ending in one period can
  # leak into the next (labels span up to ~1 month).
  train: ["2016-01-01", "2021-12-31"]
  validation: ["2022-01-01", "2023-12-31"]
  test: ["2024-01-01", null]          # locked: opening it is logged (data/db/rl/test_access.log)
  embargo_days: 35

dataset:
  start: "2015-01-01"                 # observations need ~1 year of history before training starts
  decision: weekly                    # last trading day of each week
  names_per_sleeve: 5                 # each industry sleeve = its top buy candidates, inverse-volatility weighted
  # first symbol with prices on the date; the long-established fund first, so the haven
  # never switches funds (a switch sells everything and realizes gains)
  haven: {gold: [GLD, IAU], tbills: [BIL, SGOV]}

env:
  initial_cash: 10000
  episode_weeks: 52                   # random 1-year episodes in training; full period for evaluation
  reward:
    drawdown_penalty: 0.5             # times the deepening of the drawdown this step
    turnover_penalty: 0.0             # times sleeve-level turnover (costs and taxes are already in equity)

readiness:
  # Data quality bar for training. Each failed check is a blocker.
  min_years_prices: 8                 # tracked-industry stocks with prices, per year, over at least this many years
  min_names_per_year: 300
  min_dead_with_prices_share: 0.25    # of companies that left (failed/delisted) since the train start, share with prices
  max_missing_core: 0.35              # max share of missing values in a core signal within the liquid universe
  core_signals: [mom_12_1, high_52w, vol_60d, gross_prof, op_cf_assets, net_issuance, ret_1d]
  min_composite_months: 60            # months of out-of-sample composite history
  min_regime_coverage: 0.95           # share of trading days since train start with VIX, credit spread and breadth
  max_pit_violations: 0               # rows public before they could have been
  required: [panel, validation, daily, regime, portfolio, rl_dataset]
  optional: [inst_holdings, intraday, spreads, news]
