# Investment screens: the user does not invest in weapons makers, Israeli
# companies, or companies that are not Sharia compliant.
#
# Screens restrict the TRADING universe only. Screened-out companies stay in
# the database as training data (industry dynamics, failures, peers) unless
# exclude_from_training is set to true.
#
# Status per (company, screen): pass | fail | review (needs a human/LLM check) | unknown (missing data)
# A company is tradable at date t only if every screen is `pass` as of t.

exclude_from_training: false

israel:
  # EDGAR state/country code for Israel
  edgar_code: L3
  # User decision (2026-11-23): headquartered in Israel. HQ = SEC business
  # address (or business city) in Israel -> fail. Incorporated in Israel but
  # headquartered elsewhere -> review (not tradable until the user confirms).
  rule: "fail if headquartered in Israel; review if only incorporated there"
  # User decision (2026-11-23, later): exclude the incorporated-only companies too.
  incorporated_only_status: fail
  # Companies headquartered in Israel whose SEC addresses are elsewhere, or
  # other additions the user decides on. Format: TICKER: reason
  manual_fail: {}

weapons:
  # User decision (2026-11-23): the gray zone is excluded outright. Everything
  # flagged `review` below (mixed civilian/military codes, defense keywords,
  # DoD-revenue share, defense software) becomes `fail`. Excluded companies are
  # still trained on and monitored for useful information (monitor_excluded).
  gray_zone_status: fail
  monitor_excluded: true
  # Ordnance & accessories, small arms, ammunition, tanks
  fail_sic: [3480, 3482, 3483, 3484, 3489, 3795]
  # Guided missiles & space vehicles, propulsion, search/navigation (defense electronics),
  # aircraft parts: mixed civilian/military, so flagged for review instead of auto-failed
  review_sic: [3761, 3764, 3769, 3812, 3728]
  fail_name_keywords: [ordnance, munitions, ammunition, firearms, "arms ", missile, armament]
  review_name_keywords: [defense, defence, tactical, military]
  # Department of Defense contract obligations (trailing 12 months, as published)
  # as a share of revenue. Above this -> review.
  dod_revenue_share_review: 0.10
  # Known weapons manufacturers / major weapons-systems suppliers (business identity, not performance)
  manual_fail:
    LMT: "weapons systems prime (missiles, fighter jets)"
    RTX: "missiles and defense systems (Raytheon)"
    NOC: "weapons systems prime"
    GD: "weapons systems, munitions, combat vehicles"
    LHX: "defense electronics and weapons systems"
    HII: "warships"
    BA: "military aircraft and weapons (defense segment)"
    TXT: "military aircraft and weapons systems"
    LDOS: "defense systems integrator"
    AVAV: "loitering munitions (Switchblade)"
    KTOS: "military drones, hypersonic weapons"
    AJRD: "missile propulsion (Aerojet Rocketdyne)"
    BWXT: "naval nuclear propulsion for warships"
    MRCY: "defense electronics for weapons systems"
    CW: "defense systems"
    AXON: "conducted energy weapons (TASER)"
    SWBI: "firearms"
    RGR: "firearms"
    OLN: "ammunition (Winchester)"
    ESLT: "Israeli defense prime (Elbit Systems)"
    BYRN: "less-lethal weapons"
    PLTR: "REVIEW: defense / military targeting software"

sharia_business:
  # User decision (2026-11-23): crypto is permissible. Crypto-industry companies
  # pass the business screen (incl. those filed under finance codes 6199/6211);
  # they must still pass the financial ratio screens.
  crypto_allowed: true
  # Core business activities that are not permissible
  fail_sic:
    - [6000, 6099]   # banks and credit institutions (interest-based)
    - [6110, 6199]   # credit, lending, finance services -> see review_sic for crypto miners
    - [6300, 6411]   # conventional insurance
    - [2080, 2085]   # alcoholic beverages
    - [2111, 2141]   # tobacco
    - [5813, 5813]   # drinking places
    - [7993, 7993]   # gambling / coin-operated amusement
    - [7011, 7011]   # hotels & casinos (review_name_keywords catch pure hotels)
  # SEC codes many crypto miners/exchanges use ("finance services" 6199, brokers 6211)
  review_sic: [6199, 6211, 6798]
  fail_name_keywords: [bank, bancorp, bancshares, insurance, casino, gaming, brewing, brewery, distill, wine, spirits, tobacco, cannabis]

sharia_financial:
  # AAOIFI-style financial ratio screens, evaluated quarterly with only data
  # known at that date. Market cap = as-traded close x shares outstanding,
  # averaged over the trailing window (S&P Shariah uses 36 months, Dow Jones 24).
  market_cap_window_months: 36
  max_debt_to_market_cap: 0.30
  max_cash_and_interest_securities_to_market_cap: 0.30
  max_impermissible_income_share: 0.05      # interest income / revenue as the measurable proxy
  min_months_of_price_history: 6

# Open questions for the user (screens use the defaults until decided)
decisions:
  crypto: "DECIDED 2026-11-23: allowed (ratio screens still apply)."
  israel_scope: "DECIDED 2026-11-23: headquartered in Israel; Israeli-incorporated companies headquartered elsewhere are also excluded."
  weapons_scope: "DECIDED 2026-11-23: gray zone excluded outright; excluded companies are trained on and monitored."
